---
# https://docs.github.com/actions/learn-github-actions
name: release
'on':
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
cache-mode: none

env:
  CW_LLVM_MINGW_DL: '1'
  CW_LLVM_MINGW_ONLY: '1'
  CW_MAP: '0'
  CW_JOBS: '5'
  CW_CURL_TEST: '1'
  DO_NOT_TRACK: '1'
  SIGN_PKG_KEY_ID: 'BDCF067D3908B2727A4A948767C1003740BF8DC2'

jobs:
  win:
    if: ${{ github.repository_owner == 'curl' }}
    name: 'Windows (ARM64, x64)'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    environment: 'production-with-deploy'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: '300'
      - name: 'build'
        env:
          COSIGN_AGE_PASS: '${{ secrets.COSIGN_AGE_PASS }}'
          COSIGN_KEY_PASS: '${{ secrets.COSIGN_KEY_PASS }}'
          DEPLOY_AGE_PASS: '${{ secrets.DEPLOY_AGE_PASS }}'
          DEPLOY_KEY_PASS: '${{ secrets.DEPLOY_KEY_PASS }}'
          MINISIGN_AGE_PASS: '${{ secrets.MINISIGN_AGE_PASS }}'
          MINISIGN_KEY_PASS: '${{ secrets.MINISIGN_KEY_PASS }}'
          SIGN_SSH_AGE_PASS: '${{ secrets.SIGN_SSH_AGE_PASS }}'
          SIGN_SSH_KEY_PASS: '${{ secrets.SIGN_SSH_KEY_PASS }}'
          SIGN_CODE_AGE_PASS: '${{ secrets.SIGN_CODE_AGE_PASS }}'
          SIGN_CODE_KEY_PASS: '${{ secrets.SIGN_CODE_KEY_PASS }}'
          SIGN_PKG_AGE_PASS: '${{ secrets.SIGN_PKG_AGE_PASS }}'
          SIGN_PKG_KEY_PASS: '${{ secrets.SIGN_PKG_KEY_PASS }}'
          CW_LLVM_MINGW_DL: '1'
          CW_LLVM_MINGW_ONLY: '1'
        run: |
          export CW_CONFIG="${GITHUB_REF_NAME}-werror-canonsrc-werror-trurl-win"
          export CW_REVISION; CW_REVISION="$(TZ=UTC date +'%Y%m%d')"
          . ./_versions.sh
          sudo podman image trust set --type reject default
          sudo podman image trust set --type accept docker.io/library
          time podman pull "${OCI_IMAGE_DEBIAN_TESTING}"
          podman images --digests
          time podman run --volume "$(pwd):$(pwd)" --workdir "$(pwd)" \
            --env-file <(env | grep -a -E \
              '^(CW_|SIGN_|COSIGN_|MINISIGN_|GITHUB_|DO_NOT_TRACK)') \
            "${OCI_IMAGE_DEBIAN_TESTING}" \
            sh -c ./_ci-linux-debian.sh

      - name: 'list dependencies'
        run: cat urls.txt ./*-version-*.txt || true
      # https://github.com/actions/upload-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'curl-windows-tool'
          retention-days: 5
          path: |
            curl-*-*-*/curl*
            curl-*-*-*/trurl*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'curl-windows'
          retention-days: 5
          path: |
            *-*-mingw*.*
            urls.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'curl-windows-all'
          retention-days: 5
          path: |
            all-mingw*.*
