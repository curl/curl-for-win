    secure: 'OnmQRlYaVGvoXGqjCW72gmWCGh89KxjCCpNRwC7Gqbr2CVRBeLgTem558dmbgeJW'
  DEPLOY_AGE_PASS:
    secure: 'abLXuqdfwj2eEIRPDttWH7Bya0JqHvmKTcyiOFJh2lnbbZ7ubhydO67LX4+TytV3e51bHRTMUA4PCauppBcSGrqt94bHU7k2nTq10mGfCpM='
  DEPLOY_KEY_PASS:
    secure: 'CS5o1b7BhBEmoEq+RFaTmtWpAd3HqHLqnpJvkAjF+DmnlJVPLo34MeusmnJ56wAX'
  DO_NOT_TRACK: '1'
build_script:
  - sh: |
      ls -l /etc/apt/sources.list.d
      sudo find /etc/apt/sources.list.d -type f -not -name 'ubuntu.sources' -delete -print  # delete google-chrome.sources and other undesired sources
      sudo apt-get -o Dpkg::Use-Pty=0 update
      sudo rm -f /var/lib/man-db/auto-update
      sudo apt-get -o Dpkg::Use-Pty=0 install -y --no-install-suggests --no-install-recommends podman slirp4netns uidmap
      export CW_CONFIG="${APPVEYOR_REPO_BRANCH}-canonsrc-werror-trurl-win"
      . ./_versions.sh
      mkdir -p ~/.config/containers/
      printf '[storage]\ndriver = "overlay"\n' > ~/.config/containers/storage.conf
      sudo loginctl enable-linger "$(id -u)"
      sudo podman image trust set --type reject default
      sudo podman image trust set --type accept docker.io/library
      time podman pull "${OCI_IMAGE_DEBIAN_TESTING}"
      podman info
      time podman run --security-opt seccomp=unconfined --volume="$(pwd):$(pwd)" --workdir="$(pwd)" \
        --env-file=<(env | grep -a -E \
          '^(CW_|SIGN_|COSIGN_|MINISIGN_|DEPLOY_|APPVEYOR_|CI_|DO_NOT_TRACK)') \
        "${OCI_IMAGE_DEBIAN_TESTING}" \
        sh -c ./_ci-linux-debian.sh

artifacts:
  - path: '*-*-mingw*.*'
    name: 'package'
  - path: 'all-mingw*.*'
    name: 'all'

