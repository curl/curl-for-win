---
# yamllint disable rule:line-length
version: '1.0.{build}'
branches:
  only:
    - 'main'
    - 'main-libressl'
    - 'main-openssl'
    - 'main-boringssl'
    - 'main-awslc'
    - 'main-mini'
    - 'dev'
    - 'dev-libressl'
    - 'dev-openssl'
    - 'dev-boringssl'
    - 'dev-awslc'
    - 'dev-mini'
    - 'test'
    - 'test-libressl'
    - 'test-openssl'
    - 'test-boringssl'
    - 'test-awslc'
    - 'test-mini'
# https://www.appveyor.com/docs/build-environment/#build-worker-images
# https://www.appveyor.com/docs/linux-images-software/
image: 'Ubuntu2404'
clone_depth: 8
build:
  verbosity: 'detailed'
environment:
  CW_LLVM_MINGW_DL: '1'
  CW_LLVM_MINGW_ONLY: '1'
  CW_MAP: '0'
  CW_JOBS: '2'
  CW_CURL_TEST: '1'
  SIGN_CODE_AGE_PASS:
    secure: 'abLXuqdfwj2eEIRPDttWH6lp2c8C2Rtz437nnMOxT6FDS1yWu272JPXDAq5hcqub/AafmIjMcMZroK6LP8rYIQ4yVwNCdYU4l7Qu0wz9/qA='
  SIGN_CODE_KEY_PASS:
    secure: 'dGiua20PNhgaxUGN2xEksAsyeobYHBu6Sh3OJFMGT7qvJRE8h+CoZ0MzRGWrrLxk'
  SIGN_PKG_KEY_ID: 'BDCF067D3908B2727A4A948767C1003740BF8DC2'
  SIGN_PKG_AGE_PASS:
    secure: 'abLXuqdfwj2eEIRPDttWHzS3ZAUdGu6oJDbaKvXMoE+vFFPvhap7dMrY/CD64+JA3KEAICUkRPccHekAw5s4qVY9RkaVLMcrkX0SY2fI6bg='
  SIGN_PKG_KEY_PASS:
    secure: 'hPd2pmh39DzHjaINLeLKHl3VGVuAuRlLt05nhU7fph55KBeTBjtkHNaKUxBu+3Ev'
  SIGN_SSH_AGE_PASS:
