  SIGN_SSH_KEY_PASS:
    secure: 'Pnm50UaoYxvXxJGOfbCt67Pa2ZVMv3ZqG0lzDFqGHmo+NqTkhQHnV2Gb9mv/k2ch'
  MINISIGN_AGE_PASS:
    secure: 'abLXuqdfwj2eEIRPDttWHzuGnuKnMX4SAglUz8MUNMc/5MBuhUu9Qx675+HrfQOeEln1zBIbMWdiSgfi1avCwoS9eE+ZZd7Egi4e4icEPus='
  MINISIGN_KEY_PASS:
    secure: 'zVUZlA13ycmDZs10UNTpFRC3zPZgZCbRTcj2lLEzVxllwHJ8eKL8wnhxOVGYg560'
  COSIGN_AGE_PASS:
    secure: 'abLXuqdfwj2eEIRPDttWH94uZrYHLg640oMdTLmBHnShCfRNvzkCQ9lN8YeSUmXMyzQtbAnAgHwFBa1VeZaNNZNluUxEWAVCzfnmSTPswro='
